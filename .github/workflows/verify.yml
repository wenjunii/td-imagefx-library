name: Verify repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository safety check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository and immutable package history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install motion-math test dependency
        run: python -m pip install -r requirements-test.txt
      - name: Verify source, tests, credentials and immutable history once
        env:
          IMMUTABLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A newly created main branch has no previous published tree.
          if [ "$IMMUTABLE_BASE" = "0000000000000000000000000000000000000000" ]; then
            IMMUTABLE_BASE=HEAD
          fi
          python tools/verify_local.py --base "$IMMUTABLE_BASE"
